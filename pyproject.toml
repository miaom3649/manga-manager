[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmanga"
version = "1.0.0"
description = "HManガ - Local comic and illustration manager for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<12",
  "pillow-heif>=0.21,<1",
  "python-multipart>=0.0.20,<1",
  "pyside6>=6.8,<7",
  "qrcode[pil]>=8,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "watchdog>=6,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
hmanga = "hmanga.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hmanga = ["web/**/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
